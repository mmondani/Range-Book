<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análisis de blanco — mobile · RangeBook · 001</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0D0F}
.rb{--bg:#0B0D0F;--surface:#14181C;--surface-2:#1C2126;--surface-3:#262C33;--border:#2E353D;--text:#F2F4F5;--text-2:#B4BCC5;--text-3:#8A949F;--accent:#FF6A1A;--accent-soft:rgba(255,106,26,.14);--on-accent:#1A0B02;--success:#3DD68C;--warning:#F5C04A;--danger:#FF6B6B;--info:#5AA9FF;font-family:'Barlow',system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:16px;line-height:1.5}
.rb *{box-sizing:border-box}
.rb h1,.rb h2,.rb h3,.rb p{margin:0}
.display{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.01em;text-transform:uppercase;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;font:600 16px 'Barlow',sans-serif;cursor:pointer;text-decoration:none;color:var(--text);background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);color:var(--on-accent)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--text);cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.seg{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--text-2);font:600 15px 'Barlow',sans-serif;cursor:pointer}
.seg.on{background:var(--surface-3);color:var(--text)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.dist{display:inline-flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-size:14px;color:var(--text-2)}
.dist b{color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:18px}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sm{width:18px;height:18px}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
<link rel="stylesheet" href="../assets/frame.css">
<link rel="stylesheet" href="../assets/viewer.css">
</head>
<body class="mk-mobile">
<div class="rb phone" data-analyzer style="width:390px;height:844px;position:relative;overflow:hidden">
  <header style="position:absolute;top:0;left:0;right:0;height:64px;padding:0 8px;display:flex;align-items:center;gap:4px;background:var(--bg);border-bottom:1px solid var(--border);z-index:3">
    <a href="sesion-detalle.html" class="icon-btn" aria-label="Volver a la sesión"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <div style="flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:0">
      <h1 class="display" style="font-size:22px">Análisis · Ronda 1</h1>
      <span style="font-size:13px;color:var(--text-3)">ISSF Pistola Precisión · 25 m · 15 disparos</span>
    </div>
    <button class="icon-btn" aria-label="Deshacer último cambio" data-action="undo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></button>
  </header>

  <main style="position:absolute;inset:64px 0 136px 0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px">
    <div class="tgt"></div>

    <div style="display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--text-2)">
      <span style="display:inline-flex;align-items:center;gap:6px"><span aria-hidden="true" class="sw-imp"></span>Impacto</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><span aria-hidden="true" style="color:var(--info);font-weight:700">+</span>PMI</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><span aria-hidden="true" style="width:14px;height:14px;border-radius:50%;border:2px dashed var(--accent)"></span>Grupo</span>
    </div>

    <div role="toolbar" aria-label="Modo de edición" style="display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--border)">
      <button type="button" class="seg" data-action="detect"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"></path><path d="m14 7 3 3"></path><path d="M5 6v4"></path><path d="M19 14v4"></path><path d="M10 2v2"></path><path d="M7 8H3"></path><path d="M21 16h-4"></path></svg>Detectar</button>
      <button type="button" class="seg on" aria-pressed="true" data-mode="add"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8"></path><path d="M8 12h8"></path></svg>Agregar</button>
      <button type="button" class="seg" aria-pressed="false" data-mode="remove"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12h8"></path></svg>Quitar</button>
    </div>

    <div role="status" data-mismatch style="display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:color-mix(in srgb, var(--warning) 10%, transparent);border:1px solid color-mix(in srgb, var(--warning) 35%, transparent);font-size:14px">
      <svg class="i sm" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--warning);margin-top:2px"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
      <span><b class="num" data-m="count"></b> impactos marcados de <b>15</b> disparos. <span data-m="hint"></span></span>
    </div>

    <section aria-label="Métricas" style="display:flex;flex-direction:column;gap:8px">
      <div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div style="display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Puntaje</span><span class="display num" style="font-size:44px;color:var(--accent)"><span data-m="score"></span><span style="font-size:20px;color:var(--text-3)"> / <span data-m="max"></span></span></span></div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="eyebrow">Prom./tiro</span><span class="display num" style="font-size:28px" data-m="avg"></span></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <span class="eyebrow">Distribución por zona</span>
          <div data-dist style="display:flex;flex-wrap:wrap;gap:6px"></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Grupo</span><span class="display num" style="font-size:26px"><span data-m="es"></span><span style="font-size:14px;color:var(--text-3)"> mm</span></span><span class="num" style="font-size:12px;color:var(--text-3)">≈ <span data-m="moa"></span> MOA</span></div>
        <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:2px"><span class="eyebrow">PMI</span><span class="display num" style="font-size:26px"><span data-m="off"></span><span style="font-size:14px;color:var(--text-3)"> mm</span></span><span style="font-size:12px;color:var(--text-3)">hacia las <span data-m="clock"></span> h</span><span class="num" style="font-size:12px;color:var(--text-2)">X <span data-m="mx"></span> · Y <span data-m="my"></span></span></div>
        <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Al centro</span><span class="display num" style="font-size:26px"><span data-m="dc"></span><span style="font-size:14px;color:var(--text-3)"> mm</span></span><span style="font-size:12px;color:var(--text-3)">prom. por tiro</span></div>
      </div>
    </section>

    <a href="analisis-calibracion.html" class="btn btn-ghost" style="align-self:flex-start"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M22 12h-4"></path><path d="M6 12H2"></path><path d="M12 6V2"></path><path d="M12 22v-4"></path></svg>Recalibrar la foto</a>
  </main>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:4px 16px 24px;background:var(--bg);border-top:1px solid var(--border)">
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-2);cursor:pointer;min-height:44px"><input type="checkbox" checked style="width:20px;height:20px;accent-color:var(--accent);flex-shrink:0"><span>Usar el puntaje calculado (<b class="num" data-m="score" style="color:var(--text)"></b>) en la ronda. Puntaje cargado: 138.</span></label>
    <a href="sesion-detalle.html" class="btn btn-primary" style="width:100%">Guardar análisis</a>
  </div>
</div>
<script src="../assets/app.js"></script>
<script src="../assets/viewer.js"></script>
<script src="../assets/analyzer.js"></script>
</body>
</html>
