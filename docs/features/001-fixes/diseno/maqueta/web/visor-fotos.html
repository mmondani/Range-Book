<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de fotos — web · RangeBook · 001</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#000}
/* El visor no cambia con el tema: fondo negro y botones como los que van sobre fotos. */
.viewer{position:relative;overflow:hidden;background:#000;color:#F2F4F5;font:16px/1.5 'Barlow',system-ui,sans-serif}
.viewer *{box-sizing:border-box}
.slides{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo{width:min(1100px, 100%);aspect-ratio:4/3;max-width:100%;max-height:100%;transition:transform .2s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:center;color:#8A949F;font-size:14px;background:repeating-linear-gradient(135deg,#1C2126 0 10px,#20262C 10px 20px)}
.bar{position:absolute;left:0;right:0;top:0;padding:12px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.count{font-weight:600;font-variant-numeric:tabular-nums;padding:0 8px}
.ov{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(11,13,15,.75);color:#F2F4F5;cursor:pointer;text-decoration:none}
.ov:disabled{opacity:.4;cursor:default}
.ov svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.zoom{position:absolute;right:12px;bottom:16px;display:flex;gap:8px}
.nav{position:absolute;top:50%;transform:translateY(-50%)}
.prev{left:16px}.next{right:16px}
.ov:focus-visible{outline:2px solid #FF6A1A;outline-offset:2px}
</style>
<link rel="stylesheet" href="../assets/frame.css">
</head>
<body class="">
<div class="viewer rb" role="dialog" aria-modal="true" aria-label="Fotos del polígono" style="width:100vw;height:100vh">
  <div class="slides" data-slides>
    <div class="slide"><div class="photo">[Foto del polígono 1]</div></div>
    <div class="slide"><div class="photo">[Foto del polígono 2]</div></div>
    <div class="slide"><div class="photo">[Foto del polígono 3]</div></div>
  </div>
  <div class="bar">
    <span class="count" aria-live="polite" data-count>1 / 3</span>
    <a href="sesiones.html" class="ov" aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
  </div>
  <button type="button" class="ov nav prev" aria-label="Foto anterior" data-prev><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
  <button type="button" class="ov nav next" aria-label="Foto siguiente" data-next><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
  <div class="zoom">
    <button type="button" class="ov" aria-label="Acercar" data-in><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path><path d="M11 8v6"></path><path d="M8 11h6"></path></svg></button>
    <button type="button" class="ov" aria-label="Alejar" data-out disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path><path d="M8 11h6"></path></svg></button>
  </div>
</div>
<script src="../assets/app.js"></script>
<script>
// Referencia de comportamiento de PhotoViewer: deslizar (o flechas / teclado) cambia de foto,
// el zoom vuelve a 1 al cambiar, Escape o "Cerrar" vuelven atrás. En la app, además, dos dedos
// acercan y desplazan (y un dedo desplaza la foto ampliada), y un doble toque acerca o vuelve.
(function () {
  var slides = document.querySelector('[data-slides]');
  var count = document.querySelector('[data-count]');
  var photos = slides.querySelectorAll('.photo');
  var zoom = 1, current = 0;
  function apply() {
    photos.forEach(function (p, i) { p.style.transform = 'scale(' + (i === current ? zoom : 1) + ')'; });
    document.querySelector('[data-out]').disabled = zoom <= 1;
    document.querySelector('[data-in]').disabled = zoom >= 8;
    slides.style.overflowX = zoom > 1 ? 'hidden' : 'auto';
    count.textContent = (current + 1) + ' / ' + photos.length;
    var prev = document.querySelector('[data-prev]'), next = document.querySelector('[data-next]');
    if (prev) prev.disabled = current === 0;
    if (next) next.disabled = current === photos.length - 1;
  }
  function go(i) {
    current = Math.max(0, Math.min(photos.length - 1, i));
    zoom = 1;
    slides.scrollTo({ left: current * slides.clientWidth, behavior: 'smooth' });
    apply();
  }
  slides.addEventListener('scroll', function () {
    var i = Math.round(slides.scrollLeft / slides.clientWidth);
    if (i !== current) { current = i; zoom = 1; apply(); }
  });
  photos.forEach(function (p) { p.addEventListener('dblclick', function () { zoom = zoom > 1 ? 1 : 2.5; apply(); }); });
  document.querySelector('[data-in]').addEventListener('click', function () { zoom = Math.min(8, zoom * 2); apply(); });
  document.querySelector('[data-out]').addEventListener('click', function () { zoom = Math.max(1, zoom / 2); apply(); });
  var prev = document.querySelector('[data-prev]'), next = document.querySelector('[data-next]');
  if (prev) prev.addEventListener('click', function () { go(current - 1); });
  if (next) next.addEventListener('click', function () { go(current + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') go(current - 1);
    if (e.key === 'ArrowRight') go(current + 1);
    if (e.key === 'Escape') location.href = 'sesiones.html';
  });
  apply();
})();
</script>
</body>
</html>
