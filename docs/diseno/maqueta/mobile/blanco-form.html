<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alta de blanco — mobile · Range Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0D0F}
.rb{--bg:#0B0D0F;--surface:#14181C;--surface-2:#1C2126;--surface-3:#262C33;--border:#2E353D;--text:#F2F4F5;--text-2:#B4BCC5;--text-3:#8A949F;--accent:#FF6A1A;--accent-soft:rgba(255,106,26,.14);--on-accent:#1A0B02;--success:#3DD68C;--warning:#F5C04A;--danger:#FF6B6B;font-family:'Barlow',system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:16px;line-height:1.5}
.rb *{box-sizing:border-box}
.rb h1,.rb h2,.rb h3,.rb p{margin:0}
.display{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.01em;text-transform:uppercase;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;font:600 16px 'Barlow',sans-serif;cursor:pointer;text-decoration:none;color:var(--text);background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);color:var(--on-accent)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--text);cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:14px;font-weight:600;color:var(--text-2)}
.req{color:var(--accent)}
.help{font-size:13px;color:var(--text-3)}
.input{min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:400 16px 'Barlow',sans-serif;width:100%}
.input:focus{outline:2px solid var(--accent);outline-offset:1px}
.seg-wrap{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}
.seg{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font:600 14px 'Barlow',sans-serif;cursor:pointer}
.seg.on{background:var(--surface-3);color:var(--text)}
.zrow{display:grid;grid-template-columns:72px 1fr 44px;gap:8px;align-items:center}
.zrow .input{min-height:44px;padding:8px 12px}
.ph{background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--ph-2) 10px 20px);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12px;text-align:center}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sm{width:18px;height:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
<link rel="stylesheet" href="../assets/frame.css">
</head>
<body class="mk-mobile">
<div class="rb phone" style="width:390px;height:844px;position:relative;overflow:hidden">
  <header style="position:absolute;top:0;left:0;right:0;height:64px;padding:0 8px;display:flex;align-items:center;gap:4px;background:var(--bg);border-bottom:1px solid var(--border);z-index:2">
    <a href="inventario.html" class="icon-btn" aria-label="Cerrar sin guardar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
    <h1 class="display" style="font-size:24px">Nuevo blanco</h1>
  </header>

  <form style="position:absolute;inset:64px 0 88px 0;overflow-y:auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:20px">
    <div class="field">
      <label for="nombre">Nombre <span class="req">*</span></label>
      <input id="nombre" class="input" value="ISSF Pistola Precisión">
    </div>

    <div class="field">
      <span class="lbl">Foto</span>
      <div style="display:grid;grid-template-columns:88px 1fr 1fr;gap:8px">
        <div class="ph" style="height:88px;border-radius:12px">Foto</div>
        <button type="button" class="btn btn-ghost" style="height:88px;flex-direction:column;gap:4px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>Cámara</button>
        <button type="button" class="btn btn-ghost" style="height:88px;flex-direction:column;gap:4px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>Galería</button>
      </div>
    </div>

    <div class="field">
      <span class="lbl" id="tipo-lbl">Puntuación</span>
      <div class="seg-wrap" role="radiogroup" aria-labelledby="tipo-lbl" id="tipo">
        <button type="button" class="seg on" role="radio" aria-checked="true" data-value="anillos">Anillos concéntricos</button>
        <button type="button" class="seg" role="radio" aria-checked="false" data-value="manual">Sin zonas</button>
      </div>
      <span class="help" id="tipo-help">El análisis calcula el puntaje y las medidas en mm a partir de las zonas.</span>
    </div>

    <div id="geo" style="display:flex;flex-direction:column;gap:20px">
      <div style="display:grid;grid-template-columns:1fr 120px;gap:16px;align-items:start">
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="field">
            <label for="diam" id="diam-lbl">Diámetro de la zona exterior <span class="req">*</span></label>
            <div style="position:relative"><input id="diam" class="input num" inputmode="decimal" value="500" style="padding-right:48px"><span aria-hidden="true" style="position:absolute;right:14px;top:12px;color:var(--text-3)">mm</span></div>
          </div>
          <div class="field" data-zonal>
            <label for="nz">Cantidad de zonas</label>
            <div style="display:flex;gap:8px"><input id="nz" class="input num" inputmode="numeric" value="10" style="width:72px"><button type="button" class="btn btn-ghost" id="gen" style="flex:1;padding:0 10px">Generar</button></div>
          </div>
        </div>
        <div data-zonal style="display:flex;flex-direction:column;gap:6px;align-items:center">
          <div id="preview" aria-hidden="true" style="position:relative;width:120px;height:120px;border-radius:12px;background:#E9E4D6;overflow:hidden"></div>
          <span class="help">Vista previa</span>
        </div>
      </div>

      <div class="field" data-zonal>
        <span class="lbl" id="zonas-lbl">Zonas de puntaje</span>
        <div class="zrow help" aria-hidden="true"><span>Puntaje</span><span>Diámetro (mm)</span><span></span></div>
        <div id="zonas" role="group" aria-labelledby="zonas-lbl" style="display:flex;flex-direction:column;gap:6px"></div>
        <button type="button" id="add" class="btn btn-ghost" style="border-style:dashed"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Agregar zona</button>
        <span class="help">Un impacto suma el puntaje de la zona más chica que lo contiene.</span>
      </div>
    </div>
  </form>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 24px;background:var(--bg);border-top:1px solid var(--border)">
    <a href="inventario.html" class="btn btn-primary" style="width:100%">Guardar blanco</a>
  </div>
</div>
<script src="../assets/app.js"></script>
<script>
(function () {
  var zonas = document.getElementById('zonas');
  var preview = document.getElementById('preview');
  var diam = document.getElementById('diam');

  function row(p, d) {
    var r = document.createElement('div');
    r.className = 'zrow';
    r.innerHTML = '<input class="input num" inputmode="numeric" aria-label="Puntaje" value="' + p + '">' +
      '<input class="input num" inputmode="decimal" aria-label="Diámetro en mm de la zona ' + p + '" value="' + d + '">' +
      '<button type="button" class="icon-btn" aria-label="Quitar zona ' + p + '" style="color:var(--text-2)"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg></button>';
    r.querySelector('button').addEventListener('click', function () { r.remove(); draw(); });
    zonas.appendChild(r);
  }
  function generar() {
    var n = Math.max(1, Number(document.getElementById('nz').value) || 10);
    var D = Number(diam.value) || 500;
    zonas.innerHTML = '';
    for (var k = 0; k < n; k++) row(n - k, Math.round(D * (k + 1) / n));
    draw();
  }
  function draw() {
    var D = Number(diam.value) || 1;
    var list = Array.prototype.map.call(zonas.children, function (r) {
      var v = r.querySelectorAll('input');
      return { p: Number(v[0].value), d: Number(v[1].value) };
    }).sort(function (a, b) { return b.d - a.d; });
    preview.innerHTML = '';
    list.forEach(function (z, i) {
      var s = Math.min(100, z.d / D * 94);
      var c = document.createElement('div');
      c.style.cssText = 'position:absolute;border-radius:50%;left:' + (50 - s / 2) + '%;top:' + (50 - s / 2) + '%;width:' + s + '%;height:' + s + '%;border:1px solid ' +
        (i >= list.length * 0.6 ? '#D9D4C6;background:' + (i === Math.ceil(list.length * 0.6) ? '#181818' : 'transparent') : '#2A2A2A');
      preview.appendChild(c);
    });
  }
  document.getElementById('gen').addEventListener('click', generar);
  document.getElementById('add').addEventListener('click', function () { row('', ''); });
  zonas.addEventListener('input', draw);
  diam.addEventListener('input', draw);
  document.getElementById('tipo').addEventListener('mk-change', function (e) {
    var manual = e.detail === 'manual';
    document.querySelectorAll('[data-zonal]').forEach(function (n) { n.hidden = manual; });
    document.getElementById('diam-lbl').firstChild.textContent = manual ? 'Ancho de referencia del blanco ' : 'Diámetro de la zona exterior ';
    document.getElementById('tipo-help').textContent = manual
      ? 'Sin zonas: el puntaje se carga a mano. El ancho de referencia sirve de escala para medir el grupo y el PMI en mm.'
      : 'El análisis calcula el puntaje y las medidas en mm a partir de las zonas.';
  });
  generar();
})();
</script>
</body>
</html>
