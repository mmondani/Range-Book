<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alta de arma — mobile · Range Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0D0F}
.rb{--bg:#0B0D0F;--surface:#14181C;--surface-2:#1C2126;--surface-3:#262C33;--border:#2E353D;--text:#F2F4F5;--text-2:#B4BCC5;--text-3:#8A949F;--accent:#FF6A1A;--accent-soft:rgba(255,106,26,.14);--on-accent:#1A0B02;--success:#3DD68C;--warning:#F5C04A;--danger:#FF6B6B;font-family:'Barlow',system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:16px;line-height:1.5}
.rb *{box-sizing:border-box}
.rb h1,.rb h2,.rb h3,.rb p{margin:0}
.display{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.01em;text-transform:uppercase;line-height:1.05}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;font:600 16px 'Barlow',sans-serif;cursor:pointer;text-decoration:none;color:var(--text);background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);color:var(--on-accent)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--text);cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:14px;font-weight:600;color:var(--text-2)}
.req{color:var(--accent)}
.help{font-size:13px;color:var(--text-3)}
.err{font-size:13px;color:var(--danger);display:flex;align-items:center;gap:6px}
.input{min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:400 16px 'Barlow',sans-serif;width:100%;color-scheme:var(--scheme)}
.input:focus{outline:2px solid var(--accent);outline-offset:1px}
.input.bad{border-color:var(--danger)}
.ph{background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--ph-2) 10px 20px);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12px;text-align:center}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sm{width:18px;height:18px}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
<link rel="stylesheet" href="../assets/frame.css">
</head>
<body class="mk-mobile">
<div class="rb phone" style="width:390px;height:844px;position:relative;overflow:hidden">
  <header style="position:absolute;top:0;left:0;right:0;height:64px;padding:0 8px;display:flex;align-items:center;gap:4px;background:var(--bg);border-bottom:1px solid var(--border);z-index:2">
    <a href="inventario.html" class="icon-btn" aria-label="Cerrar sin guardar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
    <h1 class="display" style="font-size:24px">Nueva arma</h1>
  </header>

  <form style="position:absolute;inset:64px 0 88px 0;overflow-y:auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:20px">
    <div class="field">
      <span class="lbl">Fotos</span>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
        <div class="ph" style="aspect-ratio:1;border-radius:12px;outline:2px solid var(--accent);outline-offset:1px">Portada</div>
        <div class="ph" style="aspect-ratio:1;border-radius:12px">2</div>
        <button type="button" class="icon-btn" aria-label="Tomar foto con la cámara" style="width:auto;height:auto;aspect-ratio:1;border:1px dashed var(--border);color:var(--text-2)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg></button>
        <button type="button" class="icon-btn" aria-label="Elegir de la galería" style="width:auto;height:auto;aspect-ratio:1;border:1px dashed var(--border);color:var(--text-2)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg></button>
      </div>
      <span class="help">La primera foto se usa como portada.</span>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div class="field">
        <label for="marca">Marca <span class="req">*</span></label>
        <input id="marca" class="input" value="Glock" autocomplete="off">
      </div>
      <div class="field">
        <label for="modelo">Modelo <span class="req">*</span></label>
        <input id="modelo" class="input bad" value="" aria-invalid="true" aria-describedby="modelo-err">
        <span id="modelo-err" class="err" role="alert"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>Ingresá el modelo</span>
      </div>
    </div>

    <div class="field">
      <label for="calibre">Calibre <span class="req">*</span></label>
      <input id="calibre" class="input" value="9×19 mm" list="calibres">
      <datalist id="calibres"><option value="9×19 mm"></option><option value=".22 LR"></option><option value=".45 ACP"></option><option value=".40 S&amp;W"></option></datalist>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div class="field">
        <label for="fcompra">Fecha de compra</label>
        <input id="fcompra" class="input" type="date" value="2023-03-14">
      </div>
      <div class="field">
        <label for="lcompra">Lugar de compra</label>
        <input id="lcompra" class="input" value="Armería Centro">
      </div>
    </div>

    <div class="field">
      <label for="previos">Tiros previos al registro</label>
      <input id="previos" class="input" type="text" inputmode="numeric" value="1200">
      <span class="help">Los disparos de cada sesión se suman automáticamente al acumulado.</span>
    </div>

    <p class="help">Las modificaciones y configuraciones se cargan desde el detalle del arma, después de guardarla.</p>
  </form>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 24px;background:var(--bg);border-top:1px solid var(--border)">
    <a href="arma-detalle.html" class="btn btn-primary" style="width:100%">Guardar arma</a>
  </div>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
