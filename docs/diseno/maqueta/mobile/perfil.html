<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil — mobile · Range Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0D0F}
.rb{--bg:#0B0D0F;--surface:#14181C;--surface-2:#1C2126;--surface-3:#262C33;--border:#2E353D;--text:#F2F4F5;--text-2:#B4BCC5;--text-3:#8A949F;--accent:#FF6A1A;--accent-soft:rgba(255,106,26,.14);--on-accent:#1A0B02;--success:#3DD68C;--warning:#F5C04A;--danger:#FF6B6B;font-family:'Barlow',system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:16px;line-height:1.5}
.rb *{box-sizing:border-box}
.rb h1,.rb h2,.rb h3,.rb p{margin:0}
.display{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.01em;text-transform:uppercase;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;font:600 16px 'Barlow',sans-serif;cursor:pointer;text-decoration:none;color:var(--text);background:var(--surface-2)}
.btn-danger{background:transparent;border-color:color-mix(in srgb, var(--danger) 45%, transparent);color:var(--danger)}
.btn-danger:hover{background:color-mix(in srgb, var(--danger) 8%, transparent);color:var(--danger)}
.seg-wrap{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}
.seg{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font:600 14px 'Barlow',sans-serif;cursor:pointer}
.seg.on{background:var(--surface-3);color:var(--text)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;text-decoration:none;color:var(--text);min-height:56px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--text-3);text-decoration:none;border-radius:12px}
.tab.on{color:var(--accent)}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sm{width:18px;height:18px}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
<link rel="stylesheet" href="../assets/frame.css">
</head>
<body class="mk-mobile">
<div class="rb phone" style="width:390px;height:844px;position:relative;overflow:hidden">
  <main style="position:absolute;inset:0 0 80px 0;overflow-y:auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:20px">
    <h1 class="display" style="font-size:34px">Perfil</h1>

    <section class="card" style="padding:16px;display:flex;gap:14px;align-items:center">
      <div aria-hidden="true" style="width:60px;height:60px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center" class="display"><span style="font-size:24px">US</span></div>
      <div style="display:flex;flex-direction:column;min-width:0">
        <span style="font-weight:600;font-size:18px">[Nombre del usuario]</span>
        <span style="font-size:14px;color:var(--text-2)">usuario@gmail.com</span>
        <span style="font-size:13px;color:var(--text-3)">Cuenta de Google</span>
      </div>
    </section>

    <section aria-label="Resumen" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Sesiones</span><span class="display num" style="font-size:26px">48</span></div>
      <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Disparos</span><span class="display num" style="font-size:26px">10.552</span></div>
      <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Armas</span><span class="display num" style="font-size:26px">3</span></div>
    </section>

    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 class="eyebrow">Preferencias</h2>
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;flex-direction:column;gap:8px">
          <span id="u-lbl" style="font-weight:600">Unidades de medida</span>
          <div class="seg-wrap" role="radiogroup" aria-labelledby="u-lbl">
            <button class="seg on" role="radio" aria-checked="true">Milímetros</button>
            <button class="seg" role="radio" aria-checked="false">Pulgadas</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <span id="t-lbl" style="font-weight:600">Tema</span>
          <div class="seg-wrap" role="radiogroup" aria-labelledby="t-lbl" data-theme-control>
            <button class="seg on" role="radio" aria-checked="true" data-value="oscuro">Oscuro</button>
            <button class="seg" role="radio" aria-checked="false" data-value="claro">Claro</button>
            <button class="seg" role="radio" aria-checked="false" data-value="sistema">Sistema</button>
          </div>
        </div>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 class="eyebrow">Aplicación</h2>
      <div class="card" style="display:flex;flex-direction:column">
        <a href="#" class="row" style="border-bottom:1px solid var(--border)">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--accent)"><path d="M12 15V3"></path><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path></svg>
          <span style="flex:1">Instalar en el dispositivo</span>
          <svg class="i sm" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--text-3)"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
        <div class="row">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--text-2)"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
          <span style="flex:1">Versión</span>
          <span class="num" style="color:var(--text-3)">0.1.0</span>
        </div>
      </div>
    </section>

    <button class="btn btn-danger" style="margin-top:8px">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg>
      Cerrar sesión
    </button>
  </main>

  <nav aria-label="Principal" style="position:absolute;left:0;right:0;bottom:0;height:80px;padding:8px 8px 18px;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px">
    <a href="sesiones.html" class="tab"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M22 12h-4"></path><path d="M6 12H2"></path><path d="M12 6V2"></path><path d="M12 22v-4"></path></svg>Sesiones</a>
    <a href="rendimiento.html" class="tab"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>Rendimiento</a>
    <a href="inventario.html" class="tab"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>Inventario</a>
    <a href="perfil.html" class="tab on" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>Perfil</a>
  </nav>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
