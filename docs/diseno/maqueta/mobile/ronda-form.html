<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agregar ronda — mobile · Range Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0D0F}
.rb{--bg:#0B0D0F;--surface:#14181C;--surface-2:#1C2126;--surface-3:#262C33;--border:#2E353D;--text:#F2F4F5;--text-2:#B4BCC5;--text-3:#8A949F;--accent:#FF6A1A;--accent-soft:rgba(255,106,26,.14);--on-accent:#1A0B02;--success:#3DD68C;--warning:#F5C04A;--danger:#FF6B6B;font-family:'Barlow',system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:16px;line-height:1.5}
.rb *{box-sizing:border-box}
.rb h1,.rb h2,.rb h3,.rb p{margin:0}
.display{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.01em;text-transform:uppercase;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;font:600 16px 'Barlow',sans-serif;cursor:pointer;text-decoration:none;color:var(--text);background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);color:var(--on-accent)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{color:var(--text);background:var(--surface-2)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--text);cursor:pointer;text-decoration:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:14px;font-weight:600;color:var(--text-2)}
.req{color:var(--accent)}
.help{font-size:13px;color:var(--text-3)}
.input{min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:400 16px 'Barlow',sans-serif;width:100%;color-scheme:var(--scheme)}
.input:focus{outline:2px solid var(--accent);outline-offset:1px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
.step{width:48px;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sm{width:18px;height:18px}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
<link rel="stylesheet" href="../assets/frame.css">
</head>
<body class="mk-mobile">
<div class="rb phone" style="width:390px;height:844px;position:relative;overflow:hidden">
  <div aria-hidden="true" style="position:absolute;inset:0;padding:76px 16px;display:flex;flex-direction:column;gap:16px">
    <div style="height:32px;width:70%;border-radius:8px;background:var(--surface-2)"></div>
    <div class="card" style="height:120px"></div>
    <div class="card" style="height:80px"></div>
    <div class="card" style="height:80px"></div>
  </div>
  <a href="sesion-detalle.html" aria-label="Cerrar" style="position:absolute;inset:0;background:rgba(0,0,0,.7)"></a>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position:absolute;left:0;right:0;bottom:0;max-height:760px;background:var(--surface);border-top-left-radius:24px;border-top-right-radius:24px;border-top:1px solid var(--border);display:flex;flex-direction:column">
    <div style="display:flex;justify-content:center;padding:10px 0 0"><span aria-hidden="true" style="width:40px;height:5px;border-radius:3px;background:var(--surface-3)"></span></div>
    <header style="display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 20px">
      <div style="display:flex;flex-direction:column">
        <span class="eyebrow">Dom 25 oct 2026</span>
        <h2 id="sheet-title" class="display" style="font-size:26px">Nueva ronda · 3</h2>
      </div>
      <a href="sesion-detalle.html" class="icon-btn" aria-label="Cerrar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
    </header>

    <form style="overflow-y:auto;padding:4px 20px 16px;display:flex;flex-direction:column;gap:18px">
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px">
        <div class="field">
          <label for="blanco">Blanco <span class="req">*</span></label>
          <select id="blanco" class="input"><option>ISSF Pistola Precisión</option><option>IPSC Classic</option><option>NRA B-8</option></select>
        </div>
        <div class="field">
          <label for="distancia">Distancia <span class="req">*</span></label>
          <div style="position:relative"><input id="distancia" class="input num" type="text" inputmode="decimal" value="25" style="padding-right:36px" aria-describedby="dist-help"><span aria-hidden="true" style="position:absolute;right:14px;top:12px;color:var(--text-3)">m</span></div>
        </div>
      </div>
      <span id="dist-help" class="help" style="margin-top:-10px">Distancia y disparos precargados de la ronda anterior.</span>

      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
        <div class="field">
          <span class="lbl" id="disp-lbl">Disparos <span class="req">*</span></span>
          <div role="group" aria-labelledby="disp-lbl" data-stepper data-min="1" style="display:flex;align-items:center;justify-content:space-between;gap:6px">
            <button type="button" class="step" aria-label="Restar un disparo" data-dec><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <output class="display num" aria-live="polite" style="font-size:30px;min-width:40px;text-align:center">15</output>
            <button type="button" class="step" aria-label="Sumar un disparo" data-inc><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
          </div>
        </div>
        <div class="field">
          <label for="puntaje">Puntaje</label>
          <input id="puntaje" class="input num" type="text" inputmode="numeric" value="138" aria-describedby="score-help" style="font-size:20px;font-weight:600">
          <span id="score-help" class="help">Máximo: 150.</span>
        </div>
      </div>

      <div class="field">
        <span class="lbl">Foto del blanco</span>
        <div style="display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2)">
          <div aria-hidden="true" style="width:72px;height:72px;border-radius:10px;background:#E9E4D6;display:flex;align-items:center;justify-content:center;flex-shrink:0"><div style="width:54px;height:54px;border-radius:50%;border:1px solid #333;display:flex;align-items:center;justify-content:center"><div style="width:30px;height:30px;border-radius:50%;background:#1B1B1B"></div></div></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0">
            <span style="font-weight:600">blanco_ronda3.jpg</span>
          </div>
          <button type="button" class="icon-btn" aria-label="Quitar foto" style="color:var(--text-2)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg></button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
          <button type="button" class="btn btn-ghost"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>Cámara</button>
          <button type="button" class="btn btn-ghost"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>Galería</button>
        </div>
        <span class="help">Con la foto vas a poder analizar los impactos y calcular el puntaje.</span>
      </div>

      <div class="field">
        <label for="coment">Comentarios</label>
        <textarea id="coment" class="input" rows="2" placeholder="Ej: tirones abajo-izquierda" style="resize:vertical"></textarea>
      </div>
    </form>

    <div style="display:grid;grid-template-columns:1fr 2fr;gap:12px;padding:12px 20px 24px;border-top:1px solid var(--border)">
      <a href="sesion-detalle.html" class="btn btn-ghost">Cancelar</a>
      <!-- Una ronda nueva con foto sigue en su análisis (sin foto, vuelve al detalle). -->
      <a href="analisis-calibracion.html" class="btn btn-primary">Guardar ronda</a>
    </div>
  </section>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
