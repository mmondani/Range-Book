<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — mobile · Range Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0D0F}
.rb{--bg:#0B0D0F;--surface:#14181C;--surface-2:#1C2126;--surface-3:#262C33;--border:#2E353D;--text:#F2F4F5;--text-2:#B4BCC5;--text-3:#8A949F;--accent:#FF6A1A;--accent-soft:rgba(255,106,26,.14);--on-accent:#1A0B02;--success:#3DD68C;--warning:#F5C04A;--danger:#FF6B6B;font-family:'Barlow',system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:16px;line-height:1.5}
.rb *{box-sizing:border-box}
.rb h1,.rb h2,.rb h3,.rb p{margin:0}
.display{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.01em;text-transform:uppercase;line-height:1.05}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 20px;border-radius:12px;border:1px solid transparent;font:600 16px 'Barlow',sans-serif;cursor:pointer;text-decoration:none}
.btn-google{background:#FFFFFF;color:#1F1F1F}
.btn-google:hover{background:#F1F3F4;color:#1F1F1F}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
<link rel="stylesheet" href="../assets/frame.css">
</head>
<body class="mk-mobile">
<div class="rb phone" style="width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:48px 24px 40px">
  <div aria-hidden="true" style="position:absolute;top:-120px;right:-160px;width:460px;height:460px;border-radius:50%;border:1px solid var(--border);box-shadow:0 0 0 60px var(--sunken),0 0 0 61px var(--border),0 0 0 120px var(--sunken),0 0 0 121px var(--border)"></div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;position:relative">
    <div style="width:72px;height:72px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:44px;height:44px;stroke-width:2.2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4.5"></circle><path d="M12 1v5"></path><path d="M12 18v5"></path><path d="M1 12h5"></path><path d="M18 12h5"></path></svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <h1 class="display" style="font-size:56px">Range Book</h1>
      <p style="font-size:18px;color:var(--text-2);max-width:300px">Tu bitácora de tiro: sesiones, armas, munición y análisis de blancos.</p>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:16px;position:relative">
    <a href="sesiones.html" class="btn btn-google">
      <svg viewBox="0 0 48 48" aria-hidden="true" style="width:22px;height:22px"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"></path><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"></path><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"></path><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"></path></svg>
      Continuar con Google
    </a>
    <p style="font-size:14px;color:var(--text-3);text-align:center">Acceso solo para cuentas autorizadas.</p>
  </div>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
