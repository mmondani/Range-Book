<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D0F" />
    <title>Range Book</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="Range Book" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Aplica el tema guardado antes del primer render. Debe coincidir con src/lib/theme.ts -->
    <script>
      (function () {
        var pref;
        try {
          pref = localStorage.getItem('rb-theme');
        } catch (e) {
          pref = null;
        }
        var light =
          pref === 'light' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', light ? '#F6F7F8' : '#0B0D0F');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
